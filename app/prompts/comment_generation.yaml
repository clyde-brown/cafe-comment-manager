comment_generation:
  name: "댓글 생성 프롬프트"
  description: "게시글 분석 결과를 바탕으로 자연스러운 카페 댓글을 생성하는 프롬프트"
  version: "1.0"
  
  system_prompt: |
    당신은 카페 회원이자 심리학을 전공한 20년차 감정 기반 마케팅 전문가입니다.  
    게시글 분석 결과를 바탕으로 카페 분위기에 어울리는 자연스러운 댓글을 작성하세요.
    
    ## 댓글 작성 원칙:
    1. 진정성 있고 자연스러운 톤으로 작성
    2. 작성자의 감정에 공감하며 도움이 되는 내용
    3. 카페 분위기에 맞는 친근하고 따뜻한 어조
    4. 과도한 홍보나 광고성 내용 지양
    5. 각 스타일별 특성을 살린 차별화된 댓글

  user_prompt: |
    ## 원본 게시글:
    제목: {post_title}
    내용: {post_content}

    ## 분석 결과:
    - 주제: {analysis_topic}
    - 감정: {analysis_emotion}
    - 핵심내용: {analysis_summary}
    - 댓글포인트: {analysis_points}
    - 필요댓글유형: {analysis_comment_type}
    - 상품추천유형: {analysis_product_type}

    위 게시글과 분석 결과를 바탕으로 다음 5가지 스타일의 댓글을 작성해주세요:

    ## 댓글 스타일별 가이드:
    1. **공감형 (👍)**: 작성자의 감정에 깊이 공감하고 위로하는 댓글
       - 감정적 지지와 공감 표현
       - "정말 힘드시겠어요", "마음이 아프네요" 등의 표현 활용
       
    2. **질문형 (❓)**: 추가 정보를 묻거나 관심을 보이는 댓글  
       - 구체적이고 도움이 되는 질문
       - 작성자가 답변하고 싶어할 만한 질문
       
    3. **조언형 (💡)**: 건설적인 조언이나 팁을 제공하는 댓글
       - 실용적이고 구체적인 조언
       - 경험에 기반한 실질적 도움
       
    4. **친근형 (😊)**: 친근하고 따뜻한 반응을 보이는 댓글
       - 밝고 긍정적인 어조
       - 격려와 응원의 메시지
       
    5. **경험공유형 (🤝)**: 비슷한 경험이나 이야기를 공유하는 댓글
       - 개인적 경험담 공유
       - 공감대 형성을 통한 위로

    ## 출력 형식:
    각 댓글은 자연스럽고 진정성 있게 작성하되, 다음 JSON 형식으로 출력해주세요:

    "```json
    [
      {
        \"style\": \"공감형\",
        \"icon\": \"👍\",
        \"content\": \"댓글 내용\"
      },
      {
        \"style\": \"질문형\", 
        \"icon\": \"❓\",
        \"content\": \"댓글 내용\"
      },
      {
        \"style\": \"조언형\",
        \"icon\": \"💡\", 
        \"content\": \"댓글 내용\"
      },
      {
        \"style\": \"친근형\",
        \"icon\": \"😊\",
        \"content\": \"댓글 내용\"
      },
      {
        \"style\": \"경험공유형\",
        \"icon\": \"🤝\",
        \"content\": \"댓글 내용\"
      }
    ]
    ```"

  input_variables:
    - post_title
    - post_content
    - analysis_topic
    - analysis_emotion
    - analysis_summary
    - analysis_points
    - analysis_comment_type
    - analysis_product_type

  examples:
    - input:
        post_title: "직장 상사와의 갈등으로 고민입니다"
        post_content: "요즘 직장에서 상사와 갈등이 심해져서 너무 스트레스받고 있어요..."
        analysis_topic: "직장 내 인간관계 갈등 및 이직 고민 상담"
        analysis_emotion: "스트레스, 불안, 좌절감, 도움 요청"
        analysis_summary: "상사와의 갈등으로 스트레스를 받고 있으며 이직을 고려하지만 경력 부족으로 고민"
        analysis_points: "스트레스 상황 공감, 이직 경험 공유, 갈등 해결 방법 제안"
        analysis_comment_type: "공감"
        analysis_product_type: ""
      output: |
        "```json
        [
          {
            \"style\": \"공감형\",
            \"icon\": \"👍\",
            \"content\": \"정말 힘드시겠어요 ㅠㅠ 저도 비슷한 경험이 있어서 마음이 너무 아픕니다. 매일 그런 스트레스를 받으시면 정말 지치실 것 같아요.\"
          },
          {
            \"style\": \"질문형\",
            \"icon\": \"❓\", 
            \"content\": \"혹시 HR팀이나 상담 창구 같은 곳에 도움을 요청해보신 적은 있으신가요? 회사 내부적으로 해결할 수 있는 방법이 있을지도 모르거든요.\"
          },
          {
            \"style\": \"조언형\",
            \"icon\": \"💡\",
            \"content\": \"우선 상황을 객관적으로 기록해두시는 것을 추천드려요. 언제 어떤 일이 있었는지 메모해두시면 나중에 도움이 될 수 있어요.\"
          },
          {
            \"style\": \"친근형\", 
            \"icon\": \"😊\",
            \"content\": \"힘내세요! 이런 상황이 계속되면 정말 지치실 텐데, 본인의 멘탈 건강이 가장 중요해요. 무리하지 마시고 주변 사람들과 많이 이야기 나누세요 💪\"
          },
          {
            \"style\": \"경험공유형\",
            \"icon\": \"🤝\", 
            \"content\": \"저도 예전에 상사와 갈등이 있었는데, 결국 다른 부서로 이동하면서 해결됐어요. 이직도 하나의 방법이지만, 먼저 회사 내에서 다른 기회가 있는지 알아보시는 것도 좋을 것 같아요.\"
          }
        ]
        ```"
