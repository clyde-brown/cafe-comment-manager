post_analysis:
  name: "게시글 분석 프롬프트"
  description: "카페 게시글을 심리학적으로 분석하여 댓글 반응 전략을 도출하는 프롬프트"
  version: "1.0"
  
  system_prompt: |
    당신은 심리학 전공의 20년차 마케팅 전문가입니다.  
    온라인 카페 게시글을 읽고, 작성자의 감정·의도·니즈를 심리학적으로 분석하여  
    어떤 댓글 반응이 가장 효과적인지 도출하세요.

  user_prompt: |
    ## 게시글:
    제목: {post_title}
    내용: {post_content}

    ## 분석 단계:
    1. 주제: 게시글의 주요 주제와 목적(정보공유, 질문, 후기, 고민, 불만 등)을 간결히 파악  
    2. 감정: 작성자의 감정 상태(기쁨, 고민, 불만, 공감요구 등)와 숨은 심리 동기(인정욕구, 확신요구 등) 추론  
    3. 핵심내용: 게시글의 가장 중요한 내용 1~2줄로 요약  
    4. 댓글포인트: 댓글로 반응하기 좋은 부분(공감 문장, 질문, 감정 표현, 문제점 등) 제시  
    5. 필요댓글유형: 아래 중 하나 선택  
       - 일반 (정보 전달, 간단한 반응 등)  
       - 공감 (위로, 감정 동조 등)  
       - 상품추천 (문제 해결 제안이나 제품 언급 필요 시)  
    6. 상품추천유형: 필요댓글유형이 '상품추천'일 경우 아래 중 하나 선택  
       - 적극적 추천 (효과 강조, 사용 경험, 강한 권유)  
       - 일반적 추천 (자연스러운 제안, 가벼운 소개)  
       - 소극적 추천 (참고용, 부드러운 언급)

    ## 조건:
    - 반드시 아래 JSON 형식으로만 출력  
    - 감정 판단 근거는 내부적으로 사고하되 결과만 출력  
    - 심리학적 통찰 + 마케팅 관점에서 판단

    ## 출력 형식:
    "```json
    {{
      \"주제\": \"게시글의 주요 주제와 목적\",
      \"감정\": \"작성자의 감정 상태와 심리 동기\",
      \"핵심내용\": \"게시글의 가장 중요한 내용 요약\",
      \"댓글포인트\": \"댓글로 반응하기 좋은 부분들\",
      \"필요댓글유형\": \"일반/공감/상품추천 중 선택\",
      \"상품추천유형\": \"적극적 추천/일반적 추천/소극적 추천 중 선택 (상품추천일 경우만)\"
    }}
    ```"

  input_variables:
    - post_title
    - post_content

  examples:
    - input:
        post_title: "직장 상사와의 갈등으로 고민입니다"
        post_content: "요즘 직장에서 상사와 갈등이 심해져서 너무 스트레스받고 있어요. 매일 작은 일로도 지적받고, 다른 동료들 앞에서 망신당하기도 하고.. 이직을 고려하고 있는데 경력이 짧아서 쉽지 않을 것 같아요. 비슷한 경험 있으신 분들 조언 부탁드려요 ㅠㅠ"
      output: |
        "```json
        {
          \"주제\": \"직장 내 인간관계 갈등 및 이직 고민 상담\",
          \"감정\": \"스트레스, 불안, 좌절감, 도움 요청\",
          \"핵심내용\": \"상사와의 갈등으로 스트레스를 받고 있으며 이직을 고려하지만 경력 부족으로 고민\",
          \"댓글포인트\": \"스트레스 상황 공감, 이직 경험 공유, 갈등 해결 방법 제안\",
          \"필요댓글유형\": \"공감\",
          \"상품추천유형\": \"\"
        }
        ```"

    - input:
        post_title: "노트북 구매 고민 중.. 추천 부탁드려요!"
        post_content: "대학생인데 노트북을 새로 사야 해서 고민이에요. 용도는 주로 과제, 넷플릭스, 가끔 게임 정도? 예산은 100만원 내외로 생각하고 있어요. 맥북 vs 윈도우 노트북 중에서도 고민이고.. IT에 밝으신 분들 조언 좀 부탁드려요!"
      output: |
        "```json
        {
          \"주제\": \"대학생 노트북 구매 추천 및 상담\",
          \"감정\": \"선택 고민, 기대감, 정보 갈증\",
          \"핵심내용\": \"대학생이 100만원 예산으로 과제/영상/게임용 노트북 구매를 고민하며 조언 요청\",
          \"댓글포인트\": \"예산 대비 성능, 용도별 추천, 맥북 vs 윈도우 비교\",
          \"필요댓글유형\": \"상품추천\",
          \"상품추천유형\": \"일반적 추천\"
        }
        ```"
