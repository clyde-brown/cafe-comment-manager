# 키워드 확장 프롬프트 템플릿
keyword_expansion:
  name: "마케팅 키워드 확장 (기본)"
  description: "타겟 키워드를 기반으로 다양한 카테고리의 마케팅 키워드를 생성합니다."
  version: "1.0"
  
  template: |
    당신은 마케팅 키워드 추출 전문가입니다.  
    주어진 키워드와 관련된 유사 키워드, 연관 검색어, 잠재 고객이 실제로 검색할 법한 변형 키워드 $keyword_count개를 제안해주세요.
    키워드의 유형은 다음과 같이 다양하게 포함해야 합니다:

    1. 직설적 키워드 (예: 제품명, 서비스명)  
    2. 문제/니즈 기반 키워드 (고객이 불편함이나 필요를 표현하는 방식)  
    3. 솔루션/혜택 키워드 (서비스의 장점, 효과, 결과 중심)  
    4. 롱테일 키워드 (자연스러운 문장형 검색어, 구체적 상황 포함)  
    5. 경쟁/대체 키워드 (비슷한 제품군, 대체제 관련)

    - 요구사항  
    출력은 반드시 아래 JSON 형식으로 해주세요:

    ```json
    {{
      "직설적": [...],
      "문제_니즈": [...],
      "솔루션_혜택": [...],
      "롱테일": [...],
      "경쟁_대체": [...]
    }}
    ```

  parameters:
    - name: "target_keyword"
      type: "string"
      description: "확장할 타겟 키워드"
      required: true
    - name: "keyword_count"
      type: "integer"
      description: "생성할 총 키워드 개수"
      default: 20
      min: 5
      max: 50

  examples:
    - input:
        target_keyword: "다이어트"
        keyword_count: 10
      output: |
        {
          "직설적": ["다이어트", "체중감량"],
          "문제_니즈": ["살빼기", "뱃살 고민"],
          "솔루션_혜택": ["건강한 다이어트", "빠른 체중감량"],
          "롱테일": ["30대 여성 다이어트 방법", "운동 없이 다이어트"],
          "경쟁_대체": ["헬스", "피트니스"]
        }

# 창의적 키워드 확장 프롬프트
keyword_expansion_creative:
  name: "창의적 키워드 확장"
  description: "창의적이고 독특한 관점에서 키워드를 확장합니다."
  version: "1.0"
  
  template: |
    당신은 창의적 마케팅 전문가입니다. 🎨
    주어진 키워드 '$target_keyword'를 중심으로 창의적이고 독특한 관점에서 $keyword_count개의 키워드를 생성해주세요.
    
    🎯 창의적 접근 방향:
    1. 감정적 연결: 사용자의 감정과 연결되는 키워드
    2. 트렌드 반영: 최신 트렌드와 연결된 키워드  
    3. 스토리텔링: 이야기가 있는 키워드
    4. 라이프스타일: 생활 방식과 연결된 키워드
    5. 미래 지향: 앞으로의 변화를 반영한 키워드
    
    출력 형식:
    ```json
    {{
      "감정연결": [...],
      "트렌드": [...], 
      "스토리": [...],
      "라이프스타일": [...],
      "미래지향": [...]
    }}
    ```

  parameters:
    - name: "target_keyword"
      type: "string"
      description: "확장할 타겟 키워드"
      required: true
    - name: "keyword_count"
      type: "integer"
      description: "생성할 총 키워드 개수"
      default: 20

# SEO 최적화 키워드 확장 프롬프트
keyword_expansion_seo:
  name: "SEO 최적화 키워드 확장"
  description: "검색엔진 최적화에 특화된 키워드를 생성합니다."
  version: "1.0"
  
  template: |
    당신은 SEO 전문가입니다. 🔍
    '$target_keyword' 키워드의 검색엔진 최적화를 위한 $keyword_count개의 키워드를 생성해주세요.
    
    📊 SEO 최적화 기준:
    1. 검색량이 높은 키워드
    2. 경쟁도가 적절한 롱테일 키워드
    3. 지역 기반 키워드 (Local SEO)
    4. 의도별 키워드 (정보성, 상업성, 탐색성)
    5. 관련 질문형 키워드
    
    출력 형식:
    ```json
    {{
      "고검색량": [...],
      "롱테일": [...],
      "지역기반": [...],
      "의도별": [...],
      "질문형": [...]
    }}
    ```

# 경쟁사 분석 키워드 확장 프롬프트  
keyword_expansion_competitor:
  name: "경쟁사 분석 키워드 확장"
  description: "경쟁사 관점에서 키워드를 분석하고 확장합니다."
  version: "1.0"
  
  template: |
    당신은 경쟁 분석 전문가입니다. 🏆
    '$target_keyword' 관련 시장에서 경쟁우위를 확보할 수 있는 $keyword_count개의 키워드를 생성해주세요.
    
    🎯 경쟁 분석 관점:
    1. 경쟁사 브랜드명 + 대안
    2. 가격 비교 키워드
    3. 기능 비교 키워드  
    4. 리뷰/평가 관련 키워드
    5. 차별화 포인트 키워드
    
    출력 형식:
    ```json
    {{
      "대안제시": [...],
      "가격비교": [...],
      "기능비교": [...],
      "리뷰평가": [...],
      "차별화": [...]
    }}
    ```

# 간단한 키워드 확장 프롬프트
keyword_expansion_simple:
  name: "간단한 키워드 확장"
  description: "빠르고 간단하게 키워드를 확장합니다."
  version: "1.0"
  
  template: |
    '$target_keyword'와 관련된 키워드 $keyword_count개를 간단하게 생성해주세요.
    
    다음 JSON 형식으로만 답변해주세요:
    ```json
    {{
      "관련키워드": [...]
    }}
    ```
