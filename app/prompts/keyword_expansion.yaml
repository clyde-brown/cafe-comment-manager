# 키워드 확장 프롬프트 템플릿 (v2 - 유연한 구조)
keyword_expansion:
  name: "마케팅 키워드 확장 (기본)"
  description: "타겟 키워드를 기반으로 다양한 카테고리의 마케팅 키워드를 생성합니다."
  version: "2.0"
  
  template: |
    당신은 20년차 마케터입니다. 특정 키워드를 들었을 때 함께 떠올릴 수 있는 단어나 개념을 연상하고 분류하는 일을 전문으로 합니다.
    단순한 유의어를 넘어 잠재 고객들이 '$target_keyword'와 관련해 겪을 수 있거나 대비하거나 행동으로 연결될 수 있는 단어 정확히 $keyword_count개만 만들어주세요.

    ** 사용자가 입력한 단어: '$target_keyword'

    ** 다음 단계로 생각하세요:
    - 먼저 '$target_keyword'의 의미 범위를 파악합니다.
    - 그다음, 잠재 고객들이 겪을 수 있는 수 있는 감정, 상황, 행동을 확장합니다.
    - 또한, 이 단어들을 대체 단어로 확장합니다.
    - 마지막으로, 이 단어들을 5개 카테고리로 분류합니다.

    ** 카테고리는 다음과 같습니다:
    1. 유사어 / 동의어
    2. 반의어 / 대비어
    3. 상황·감정 연상어 (사람이 느끼는 감정, 상태, 상황)
    4. 대응 행동·제품 (관련된 행동, 서비스, 물건)
    5. 환경·자연 관련어 (계절, 날씨, 기후 등 맥락적 단어)

    ** 출력은 아래 예시와 같이 JSON 배열 형식으로 해주세요.

    ```json
    [
      {{
        "key": "유사어",
        "values": ["무더위", "열대야", "찜통더위"]
      }},
      {{
        "key": "반의어", 
        "values": ["시원", "그늘", "서늘한 바람"]
      }},
      {{
        "key": "상황_감정",
        "values": ["짜증", "갈증", "지침"]
      }},
      {{
        "key": "대응_행동",
        "values": ["에어컨", "부채", "아이스커피"]
      }},
      {{
        "key": "환경_자연",
        "values": ["땡볕", "열돔", "기후변화"]
      }}
    ]
    ```

  parameters:
    - name: "target_keyword"
      type: "string"
      description: "확장할 타겟 키워드"
      required: true
    - name: "keyword_count"
      type: "integer"
      description: "생성할 총 키워드 개수"
      default: 20
      min: 5
      max: 50

# 창의적 키워드 확장 프롬프트
keyword_expansion_creative:
  name: "창의적 키워드 확장"
  description: "창의적이고 독특한 관점에서 키워드를 확장합니다."
  version: "2.0"
  
  template: |
    당신은 창의적 마케팅 전문가입니다. 🎨
    주어진 키워드 '$target_keyword'를 중심으로 창의적이고 독특한 관점에서 $keyword_count개의 키워드를 생성해주세요.
    
    🎯 창의적 접근 방향:
    1. 감정적 연결: 사용자의 감정과 연결되는 키워드
    2. 트렌드 반영: 최신 트렌드와 연결된 키워드  
    3. 스토리텔링: 이야기가 있는 키워드
    4. 라이프스타일: 생활 방식과 연결된 키워드
    5. 미래 지향: 앞으로의 변화를 반영한 키워드
    
    출력 형식:
    ```json
    [
      {{
        "key": "감정연결",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "트렌드", 
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "스토리",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "라이프스타일",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "미래지향",
        "values": ["키워드1", "키워드2", ...]
      }}
    ]
    ```

  parameters:
    - name: "target_keyword"
      type: "string"
      description: "확장할 타겟 키워드"
      required: true
    - name: "keyword_count"
      type: "integer"
      description: "생성할 총 키워드 개수"
      default: 20

# SEO 최적화 키워드 확장 프롬프트
keyword_expansion_seo:
  name: "SEO 최적화 키워드 확장"
  description: "검색엔진 최적화에 특화된 키워드를 생성합니다."
  version: "2.0"
  
  template: |
    당신은 SEO 전문가입니다. 🔍
    '$target_keyword' 키워드의 검색엔진 최적화를 위한 $keyword_count개의 키워드를 생성해주세요.
    
    📊 SEO 최적화 기준:
    1. 검색량이 높은 키워드
    2. 경쟁도가 적절한 롱테일 키워드
    3. 지역 기반 키워드 (Local SEO)
    4. 의도별 키워드 (정보성, 상업성, 탐색성)
    5. 관련 질문형 키워드
    
    출력 형식:
    ```json
    [
      {{
        "key": "고검색량",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "롱테일", 
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "지역기반",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "의도별",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "질문형",
        "values": ["키워드1", "키워드2", ...]
      }}
    ]
    ```

# 경쟁사 분석 키워드 확장 프롬프트  
keyword_expansion_competitor:
  name: "경쟁사 분석 키워드 확장"
  description: "경쟁사 관점에서 키워드를 분석하고 확장합니다."
  version: "2.0"
  
  template: |
    당신은 경쟁 분석 전문가입니다. 🏆
    '$target_keyword' 관련 시장에서 경쟁우위를 확보할 수 있는 $keyword_count개의 키워드를 생성해주세요.
    
    🎯 경쟁 분석 관점:
    1. 경쟁사 브랜드명 + 대안
    2. 가격 비교 키워드
    3. 기능 비교 키워드  
    4. 리뷰/평가 관련 키워드
    5. 차별화 포인트 키워드
    
    출력 형식:
    ```json
    [
      {{
        "key": "대안제시",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "가격비교", 
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "기능비교",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "리뷰평가",
        "values": ["키워드1", "키워드2", ...]
      }},
      {{
        "key": "차별화",
        "values": ["키워드1", "키워드2", ...]
      }}
    ]
    ```

# 간단한 키워드 확장 프롬프트
keyword_expansion_simple:
  name: "간단한 키워드 확장"
  description: "빠르고 간단하게 키워드를 확장합니다."
  version: "2.0"
  
  template: |
    '$target_keyword'와 관련된 키워드 $keyword_count개를 간단하게 생성해주세요.
    
    다음 JSON 배열 형식으로만 답변해주세요:
    ```json
    [
      {{
        "key": "관련키워드",
        "values": ["키워드1", "키워드2", ...]
      }}
    ]
    ```
