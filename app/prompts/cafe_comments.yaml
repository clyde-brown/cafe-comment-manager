# 카페 댓글 생성 프롬프트 템플릿
cafe_comments:
  post_analysis:
    name: "카페 게시글 분석"
    description: "카페 게시글을 분석하여 주제, 감정, 핵심 내용을 파악합니다."
    template: |
      당신은 온라인 카페 게시글 분석 전문가입니다.
      다음 게시글을 분석하여 JSON 형식으로 결과를 제공해주세요.

      📝 게시글:
      {post_content}

      분석 항목:
      1. 주제 (topic): 게시글의 주요 주제를 한 단어로
      2. 감정 (emotion): 작성자의 감정 상태 (긍정적/부정적/중립적)
      3. 핵심 내용 (key_content): 게시글의 핵심 내용을 2-3문장으로 요약
      4. 댓글 포인트 (comment_points): 댓글로 반응할 만한 포인트들을 3-5개 나열

      ```json
      {{
        "topic": "주제",
        "emotion": "감정상태",
        "key_content": "핵심 내용 요약",
        "comment_points": ["포인트1", "포인트2", "포인트3"]
      }}
      ```

  comment_generation:
    name: "카페 댓글 생성"
    description: "분석된 게시글 정보를 바탕으로 다양한 스타일의 댓글을 생성합니다."
    template: |
      당신은 카페 회원으로서 자연스러운 댓글을 작성하는 AI입니다. 
      다음 게시글에 대해 실제 카페 회원이 작성할 법한 댓글을 생성해주세요.

      📝 게시글:
      {post_content}

      📊 게시글 분석:
      {post_analysis}

      📋 댓글 작성 가이드라인:
      1. 카페 분위기에 맞는 친근하고 자연스러운 톤
      2. 과도하게 길지 않고 적당한 길이 (1-2문장)
      3. 이모티콘이나 간단한 표현 활용
      4. 인터넷 용어가 적절하게 활용되어야 함
      5. 필요 시 초성체를 활용해도 좋음
      6. 실제 사람이 쓸 법한 반응과 공감
      7. 스팸이나 광고성 느낌 없이 진정성 있게

      📄 5가지 스타일 댓글 생성:

      👍 공감형: [게시글에 공감하며 응원하는 댓글]
      ❓ 질문형: [궁금한 점이나 추가 정보를 묻는 댓글]
      💡 조언형: [도움이 되는 조언이나 팁을 제공하는 댓글]
      😊 친근형: [친근하고 따뜻한 반응을 보이는 댓글]
      🤝 경험공유형: [비슷한 경험이나 이야기를 공유하는 댓글]

      JSON 형식으로 출력해주세요:
      ```json
      {{
        "comments": [
          {{"style": "공감형", "icon": "👍", "content": "댓글 내용", "tone": "공감적"}},
          {{"style": "질문형", "icon": "❓", "content": "댓글 내용", "tone": "호기심"}},
          {{"style": "조언형", "icon": "💡", "content": "댓글 내용", "tone": "도움"}},
          {{"style": "친근형", "icon": "😊", "content": "댓글 내용", "tone": "친근"}},
          {{"style": "경험공유형", "icon": "🤝", "content": "댓글 내용", "tone": "공유"}}
        ]
      }}
      ```

  tone_adjustment:
    name: "댓글 톤 조정"
    description: "생성된 댓글의 톤을 상황에 맞게 조정합니다."
    template: |
      다음 댓글을 {target_tone} 톤으로 조정해주세요.

      원본 댓글: {original_comment}
      
      조정 방향:
      - 정중한톤: 존댓말 사용, 격식 있는 표현
      - 친근한톤: 반말 사용, 편안한 표현
      - 유머러스톤: 재미있는 표현, 적절한 농담
      - 진지한톤: 신중한 표현, 깊이 있는 내용
      
      조정된 댓글만 출력해주세요.
